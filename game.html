<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Play Quiz - QuizMaster | Answer Questions & Track Your Score</title>
<meta name="description" content="Answer multiple-choice questions one at a time and watch your score update live. Test your knowledge and see how many you can get right in this fast-paced quiz challenge.">
<link rel="shortcut icon" href="./assets/img/logo.ico" type="image/x-icon">

  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nova+Square&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/assets/css/output.css">
</head>

<body class="bg-violet-50 text-black dark:bg-slate-900 dark:text-violet-50 font-display">

  <div class="container px-4 md:px-5 mx-auto">
    <div id="game" class="flex flex-col gap-4 justify-center items-center min-h-screen">

      <div id="hud" class="flex gap-16 w-full">
        <div id="hud-item" class="w-full">
          <p id="progressText" class="text-3xl">Question</p>
          <div id="progressBar" class="w-full h-2 bg-gray-300 rounded-2xl overflow-hidden">
            <div id="progressBarFull" class="h-full bg-green-500 w-0"></div>
          </div>
        </div>

        <div id="hud-item" class="">
          <p id="progressText" class="text-3xl text-center">Score</p>
          <h1 id="score" class="text-center">0</h1>
        </div>

      </div>

      <h1 id="question" class="h-24 text-xl flex justify-center items-center bg-white w-full rounded-2xl">What is the answer to this question?</h1>
      <div id="choice" class="flex gap-2 items-center w-full rounded-2xl border-2 border-violet-200 bg-white text-lg p-4 transition-all ease-in-out duration-300 hover:cursor-pointer hover:shadow-2xl hover:bg-violet-200 hover:scale-[1.02]">
        <span id="choice_Prefix" class="w-8 h-8 rounded-full bg-gray-300 flex justify-center items-center">A</span>
        <p id="choice_text" class="p-2 w-full" data-number="1">Choice1</p>
      </div>

      <div id="choice" class="flex gap-2 items-center w-full rounded-2xl border-2 border-violet-200 bg-white text-lg p-4 transition-all ease-in-out duration-300 hover:cursor-pointer hover:shadow-2xl hover:bg-violet-200 hover:scale-[1.02]">
        <span id="choice_Prefix" class="w-8 h-8 rounded-full bg-gray-300 flex justify-center items-center">B</span>
        <p id="choice_text" class="p-2 w-full" data-number="2">Choice2</p>
      </div>

      <div id="choice" class="flex gap-2 items-center w-full rounded-2xl border-2 border-violet-200 bg-white text-lg p-4 transition-all ease-in-out duration-300 hover:cursor-pointer hover:shadow-2xl hover:bg-violet-200 hover:scale-[1.02]">
        <span id="choice_Prefix" class="w-8 h-8 rounded-full bg-gray-300 flex justify-center items-center">C</span>
        <p id="choice_text" class="p-2 w-full" data-number="3">Choice3</p>
      </div>

      <div id="choice" class="flex gap-2 items-center w-full rounded-2xl border-2 border-violet-200 bg-white text-lg p-4 transition-all ease-in-out duration-300 hover:cursor-pointer hover:shadow-2xl hover:bg-violet-200 hover:scale-[1.02]">
        <span id="choice_Prefix" class="w-8 h-8 rounded-full bg-gray-300 flex justify-center items-center">D</span>
        <p id="choice_text" class="p-2 w-full" data-number="4">Choice4</p>
      </div>



    </div>
  </div>

  <script src="./assets/js/main.js"></script>

</body>

</html>
