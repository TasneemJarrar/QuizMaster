<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Play Quiz - QuizMaster | Answer Questions & Track Your Score</title>
  <meta name="description"
    content="Answer multiple-choice questions one at a time and watch your score update live. Test your knowledge and see how many you can get right in this fast-paced quiz challenge.">
  <link rel="shortcut icon" href="./assets/img/logo.ico" type="image/x-icon">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Fredoka:wght@300..700&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="./assets/css/output.css">
  <link rel="stylesheet" href="./assets/css/main.css">
</head>

<body class="bg-violet-50 text-black font-display">

  <div class="container px-4 md:px-5 mx-auto">
    <div class="flex flex-col gap-4 justify-center py-5 px-6 sm:px-8 items-center min-h-screen">

      <div class="flex gap-16 w-full px-6 sm:px-8">
        <div class="w-full flex flex-col gap-3 items-start">
          <span id="progressText" class="progressText bg-white/70 px-3 py-1 rounded-full shadow-sm">Q1 /
            10</span>
          <div class="progressBar w-full h-2 rounded-full overflow-hidden bg-indigo-600/30">
            <div
              class="progressBarFull h-full rounded-full bg-linear-to-r from-red-400 via-pink-400 to-indigo-400 transition-all duration-300 ease-in-out"
              style="width:10%"></div>
          </div>

        </div>

        <span class="bg-white/70 px-3 py-1 rounded-full shadow-sm flex gap-3 items-center">
          SCORE <span class="score text-red-400 font-bold">0</span>
        </span>

      </div>

      <div class="bg-white rounded-2xl p-6 sm:p-8 shadow-sm w-full flex flex-col gap-2 justify-end">

        <h1
          class="question  font-display text-xl sm:text-2xl font-semibold mb-4 flex justify-center items-center w-full rounded-2xl">
          What is the answer to this question?</h1>

        <div class="flex flex-col gap-3">
          <div
            class="choice flex gap-2 items-center w-full rounded-2xl border-2 border-violet-200 group text-lg p-4 transition-all ease-in-out duration-300 hover:cursor-pointer hover:shadow-2xl hover:scale-[1.01]">
            <span
              class="flex h-10 w-10 items-center justify-center rounded-full bg-violet-100 text-violet-700 font-semibold transition-all duration-300 group-hover:bg-violet-500 group-hover:text-white">
              A</span>
            <p class="choice_text p-2 w-full" data-number="1">Choice1</p>
          </div>

          <div
            class="choice flex gap-2 items-center w-full rounded-2xl border-2 border-violet-200 group text-lg p-4 transition-all ease-in-out duration-300 hover:cursor-pointer hover:shadow-2xl hover:scale-[1.01]">
            <span
              class="flex h-10 w-10 items-center justify-center rounded-full bg-violet-100 text-violet-700 font-semibold transition-all duration-300 group-hover:bg-violet-500 group-hover:text-white">B</span>
            <p class="choice_text p-2 w-full" data-number="2">Choice2</p>
          </div>

          <div
            class="choice flex gap-2 items-center w-full rounded-2xl border-2 border-violet-200 group text-lg p-4 transition-all ease-in-out duration-300 hover:cursor-pointer hover:shadow-2xl hover:scale-[1.01]">
            <span
              class="flex h-10 w-10 items-center justify-center rounded-full bg-violet-100 text-violet-700 font-semibold transition-all duration-300 group-hover:bg-violet-500 group-hover:text-white">C</span>
            <p class="choice_text p-2 w-full" data-number="3">Choice3</p>
          </div>

          <div
            class="choice flex gap-2 items-center w-full rounded-2xl border-2 border-violet-200 group text-lg p-4 transition-all ease-in-out duration-300 hover:cursor-pointer hover:shadow-2xl hover:scale-[1.01]">
            <span
              class="flex h-10 w-10 items-center justify-center rounded-full bg-violet-100 text-violet-700 font-semibold transition-all duration-300 group-hover:bg-violet-500 group-hover:text-white">D</span>
            <p class="choice_text p-2 w-full" data-number="4">Choice4</p>
          </div>
        </div>
<div class="flex justify-end">
  <button 
  class="nextBtn hidden flex gap-2 font-display font-semibold px-6 py-2.5 rounded-2xl bg-pink-500 text-white shadow-sm shadow-pink-500 hover:brightness-105">
  Next <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
	<path fill="currentColor" d="M12 21c-.801 0-1.555-.312-2.121-.879S8.999 18.8 9 17.998c0-.746.271-.998.764-1.998H4.928c-1.654 0-3-1.347-3-3s1.346-3 3-3h4.836C9.27 9 9 8.745 9 7.999a2.98 2.98 0 0 1 .88-2.121c1.132-1.132 3.108-1.133 4.241.001L21.242 13l-7.121 7.121A2.98 2.98 0 0 1 12 21m-7.072-9a1.001 1.001 0 0 0 0 2h9.658l-3.293 3.293a1 1 0 0 0-.293.706c0 .269.104.519.293.708a1.023 1.023 0 0 0 1.414 0L18.414 13l-5.707-5.707a1.023 1.023 0 0 0-1.414 0a1 1 0 0 0-.293.706c0 .268.104.519.293.708L14.586 12z" />
</svg>

</button>
</div>

      </div>


    </div>
  </div>

  <script src="./assets/js/game.js"></script>

</body>

</html>
